### TOY FIT CONFIGURATION ###
#
# Fits samples produced by standalone/gen_khyperon: the "data" are generated
# with gen_khyperon.cfg (PARA 0 only) and the generated/accepted MC is flat
# phase space (gen_khyperon -f), so there is no detector acceptance.  TOYDIR is
# replaced with the directory holding the generated files.

fit khyperon
reaction khyperon0 Beam K+ Proton Pi-

genmc khyperon0 FSRootDataReader TOYDIR/gen_khyperon_flat.root ntFSGlueX_100000000_100000 3 MC
accmc khyperon0 FSRootDataReader TOYDIR/gen_khyperon_flat.root ntFSGlueX_100000000_100000 3 MC
data  khyperon0 FSRootDataReader TOYDIR/gen_khyperon.root ntFSGlueX_100000000_100000 3

normintfile khyperon0 khyperon_NI0.ni

parameter polAngle0 1.77 fixed

sum khyperon0 khyperonPol
amplitude khyperon0::khyperonPol::khyperonAmp KHyperon [alpha] [Sigma] [Ox] [P] [T] [Oz] [polAngle0] 0.35

parameter alpha 0.732 fixed
parameter Sigma 0.0
parameter Ox  0.0
parameter P   0.0
parameter T   0.0
parameter Oz  0.0

keyword parRange 3 3
parRange Sigma -1.0 1.0
parRange Ox    -1.0 1.0
parRange P     -1.0 1.0
parRange T     -1.0 1.0
parRange Oz    -1.0 1.0

initialize khyperon0::khyperonPol::khyperonAmp cartesian 1.0 0.0 real
