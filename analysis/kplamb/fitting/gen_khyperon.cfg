### GENERATION CONFIGURATION FOR gen_khyperon ###
#
# Single reaction with the PARA 0 polarization angle and polarization fraction
# used in fit_khyperon.cfg.  The observables below are the "true" values that
# will be generated.
#
# Usage:
#   standalone/gen_khyperon -c gen_khyperon.cfg -o gen_khyperon.root -n 100000 \
#       -a 8.2 -b 8.8 -tmin 0.1 -tmax 0.2 -t 3.0

fit khyperon_gen

reaction khyperon0 Beam K+ Proton Pi-

parameter polAngle0 1.77 fixed

sum khyperon0 khyperonPol
amplitude khyperon0::khyperonPol::khyperonAmp KHyperon [alpha] [Sigma] [Ox] [P] [T] [Oz] [polAngle0] 0.35

# generated observables
parameter alpha 0.732 fixed
parameter Sigma 0.40  fixed
parameter Ox   -0.30  fixed
parameter P    -0.20  fixed
parameter T     0.50  fixed
parameter Oz    0.20  fixed

initialize khyperon0::khyperonPol::khyperonAmp cartesian 1.0 0.0 real
